server:
  port: 8900

spring:
  config:
    import: optional:nacos:bunny-flix.yml
  application:
    name: service-marketing
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yaml
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/bunny_flix?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379

rocketmq:
  name-server: localhost:9876
  producer:
    group: service-marketing-producer

mybatis-plus:
  global-config:
    db-config:
      id-type: input
