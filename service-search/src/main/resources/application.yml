server:
  port: 8400

spring:
  application:
    name: service-search
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
      config:
        # 未使用 Nacos 配置中心，关闭 spring.config.import 强制检查
        import-check:
          enabled: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/bunny_flix?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000

  data:
    redis:
      host: localhost
      port: 6379

  elasticsearch:
    uris: http://localhost:9201

# --------------- 搜索服务配置 ---------------
search:
  cache:
    # 是否启用搜索结果缓存（关闭则每次直查 ES）
    enabled: true
    # 搜索结果缓存时长（分钟，内部会加随机抖动防雪崩）
    search-ttl-minutes: 10
    # 空值缓存时长（分钟），用于防止缓存穿透
    empty-ttl-minutes: 2
    # 排行榜缓存的逻辑过期时长（分钟）
    ranking-ttl-minutes: 30
  # 慢查询阈值（毫秒）：用于守护"搜索响应 150ms 以内"的目标
  slow-query-threshold-ms: 150

rocketmq:
  name-server: localhost:9876
  producer:
    group: demo-producer-group

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
